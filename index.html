<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E2A5E">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The Gobinous Christmas Club · Saint-Gobain">
  <title>The Gobinous Christmas Club</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="loader" class="loader knit" aria-hidden="true"></div>
  <div id="app">
    <main class="screen"><p>Chargement…</p></main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <div id="fx" aria-hidden="true"></div>
  <noscript>
    <main class="screen"><h1>Gobinous Christmas Quest</h1><p>Activez JavaScript pour jouer.</p></main>
  </noscript>

  <!-- Contenus modifiables (voir README.md) -->
  <script src="config/parametres.js"></script>
  <script src="config/textes.js"></script>
  <script src="config/quiz.js"></script>
  <script src="config/quetes.js"></script>
  <script src="config/etapes.js"></script>
  <script src="config/club.js"></script>
  <script src="config/party.js"></script>
  <script src="config/wrapup.js"></script>
  <script src="config/vlog.js"></script>
  <script>
    /* Si un fichier de configuration contient une erreur de syntaxe, on
     * l'indique clairement plutôt que d'afficher une page blanche. */
    (function () {
      var c = window.GAME_CONFIG || {};
      var missing = ['parametres', 'textes', 'quiz', 'quetes', 'etapes', 'club', 'party', 'wrapup', 'vlog'].filter(function (k) { return !c[k]; });
      if (!missing.length) return;
      window.GQ_STOP = true;
      document.getElementById('app').innerHTML =
        '<main class="screen"><h1>Erreur de configuration</h1><p>Fichier(s) illisible(s) : ' +
        missing.map(function (k) { return '<code>config/' + k + '.js</code>'; }).join(', ') +
        '.</p><p>Vérifiez les guillemets et les virgules, ou lancez <code>npm run check</code> pour localiser l\'erreur.</p></main>';
    })();
  </script>

  <!-- Application -->
  <script src="js/validate.js"></script>
  <script src="js/core.js"></script>
  <script src="js/knit.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/elf.js"></script>
  <script src="js/board.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/q2-message.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/q3-photos.js"></script>
  <script src="js/q4-enquete.js"></script>
  <script src="js/q5-traque.js"></script>
  <script src="js/club.js"></script>
  <script src="js/party.js"></script>
  <script src="js/wrapup.js"></script>
  <script src="js/vlog.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/suivi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
